name: Backtest

on:
  schedule:
    - cron: "0 6 * * 0"   # jeden Sonntag
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.yaml", "bot/strategy.py", "bot/backtest.py"]

permissions:
  contents: write

concurrency:
  group: daten-schreiben
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest rechnen
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot/backtest.py
      - name: Ergebnisse speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          git add docs/data/backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "Backtest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
