name: Bot – täglicher Lauf

on:
  schedule:
    # Mo–Fr 15:00 UTC = 17:00 Uhr (Sommerzeit) bzw. 16:00 Uhr (Winterzeit) in Deutschland.
    # Die US-Börse ist dann sicher geöffnet. GitHub startet manchmal ein paar Minuten später.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll der Bot tun?"
        type: choice
        options: [probelauf, handeln]
        default: probelauf

permissions:
  contents: write

concurrency:
  group: daten-schreiben
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bot starten
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.modus }}" = "handeln" ]; then
            python bot/bot.py --handeln
          else
            python bot/bot.py
          fi

      - name: Ergebnisse speichern
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          git add docs/data bot/state.json 2>/dev/null || git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Bot-Lauf $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
